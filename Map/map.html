<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <title>Map</title>
  </head>
  <body>
    <div class="containermap" id="map">
      <img class="compass" src="compass.jpeg" alt="compass" />
      <button class="location" id="forest">
        <span class="loclable">mesä</span>
        <span class="locpin">📍</span>
      </button>
      <button class="location" id="house">
        <span class="loclable">koti</span>
        <span class="locpin">📍</span>
      </button>
      <button class="location" id="cellar">
        <span class="loclable">kellari</span>
        <span class="locpin">📍</span>
      </button>
      <button class="location" id="center">
        <span class="loclable">keskusta</span>
        <span class="locpin">📍</span>
      </button>
      <button class="location" id="storage">
        <span class="loclable">varasto</span>
        <span class="locpin">📍</span>
      </button>
      <button class="location" id="shed">
        <span class="loclable">vaja</span>
        <span class="locpin">📍</span>
      </button>
      <button class="location" id="store">
        <span class="loclable">kauppaa</span>
        <span class="locpin">📍</span>
      </button>
      <button class="location" id="ruin">
        <span class="loclable">raunio</span>
        <span class="locpin">📍</span>
      </button>
      <button class="location" id="field">
        <span class="loclable">pelto</span>
        <span class="locpin">📍</span>
      </button>
      <button class="location" id="alley">
        <span class="loclable">kuja</span>
        <span class="locpin">📍</span>
      </button>
    </div>
  </body>
</html>
